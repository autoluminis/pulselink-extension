name: Validate and publish packaged plugin

on:
  pull_request:
    paths:
      - 'incoming/**'
      - 'providers/**'
      - 'scripts/**'
  push:
    branches: [release]
    paths: ['incoming/**']

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exactly one packaged release
        shell: pwsh
        env:
          PULSELINK_PROVIDER_KEYS_JSON: ${{ secrets.PULSELINK_PROVIDER_KEYS_JSON }}
        run: >-
          ./scripts/Publish-Package.ps1 -IncomingDirectory incoming -RepositoryRoot . -ValidateOnly

  publish:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate, migrate and rebuild signed indexes
        shell: pwsh
        env:
          PULSELINK_PROVIDER_KEYS_JSON: ${{ secrets.PULSELINK_PROVIDER_KEYS_JSON }}
          PULSELINK_CATALOG_PRIVATE_KEY_PEM: ${{ secrets.PULSELINK_CATALOG_PRIVATE_KEY_PEM }}
          PULSELINK_CATALOG_KEY_ID: ${{ secrets.PULSELINK_CATALOG_KEY_ID }}
        run: >-
          ./scripts/Publish-Package.ps1 -IncomingDirectory incoming -RepositoryRoot . -Publish -AllowEmpty
      - name: Commit generated marketplace files
        shell: pwsh
        run: |
          git config user.name 'pulselink-marketplace[bot]'
          git config user.email 'pulselink-marketplace[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m '新增：发布已验证的插件包'
          git push
